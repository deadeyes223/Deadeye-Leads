name: Find leads
on:
  schedule:
    - cron: "0 12,18,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python lead_agent.py
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - run: |
          git config user.name "lead-bot"; git config user.email "bot@users.noreply.github.com"
          git add seen.json && git commit -m "update seen" && git push || true
